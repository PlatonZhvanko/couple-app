name: diag-tmp
on:
  push:
    branches: [claude/project-thread-u8j7yx]
    paths: ['tools/iclients_sync/diag.py', '.github/workflows/diag-tmp.yml']
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python tools/iclients_sync/diag.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - run: |
          curl -s "https://raw.githubusercontent.com/PlatonZhvanko/couple-app/main/supabase/functions/yclients-sync/logic.js?t=$(date +%s)" | grep -c heartbeat
          curl -s -m 30 -w "\nFUNC http %{http_code}\n" -X POST -H "x-cron-secret: x" https://izyhshljamzgyzxoupss.supabase.co/functions/v1/yclients-sync
