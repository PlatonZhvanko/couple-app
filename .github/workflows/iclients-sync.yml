name: Синхронизация YClients

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2-57/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iclients-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Подтянуть записи Насти из YClients
        env:
          YCLIENTS_COMPANY_ID: ${{ secrets.YCLIENTS_COMPANY_ID }}
          YCLIENTS_PARTNER_TOKEN: ${{ secrets.YCLIENTS_PARTNER_TOKEN }}
          YCLIENTS_USER_TOKEN: ${{ secrets.YCLIENTS_USER_TOKEN }}
          # Записи этих клиентов в приложение не переносим (через запятую).
          ICLIENTS_EXCLUDE_CLIENTS: "ДЮСШ-13, ДЮСШ-РГК, ДЮСШ-8, ДЮСШ-3"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python tools/iclients_sync/sync.py
